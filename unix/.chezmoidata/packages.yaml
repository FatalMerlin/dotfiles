# prototype/unix/.chezmoidata/packages.yaml — KYAML (flow YAML: braces, quoted
# strings, cosmetic indent). Authored here; chezmoi generates the runtime
# artifact at apply-time (run_onchange_resolve-deps). Grouped by manager; the
# map key IS the tool/command name. Migration fills this from dependencies/*.zsh.
{
  packages:
    {
      apt:
        {
          "binfmt-support": { gate: "!wsl", check: "dpkg" },
          "build-essential": { check: "dpkg" },
          "column": { package: "bsdextrautils", check: "dpkg" },
          "command-not-found": { check: "dpkg" },
          "curl": { check: "dpkg" },
          "git-lfs": { check: "dpkg" },
          "git": { check: "dpkg" },
          "libpam-ssh-agent-auth": { check: "dpkg" },
          "libssl-dev": { check: "dpkg" },
          "make": { check: "dpkg" },
          "pkg-config": { check: "dpkg" },
          "socat": { check: "dpkg" },
          "wget": { check: "dpkg" },
          "xclip": { gate: "!wsl", check: "dpkg" },
          "yakuake": { gate: "!wsl", check: "dpkg" },
        },
      brew:
        {
          "alloy": { source: "grafana-alloy" },
          "argocd": {},
          "bun": { source: "oven-sh/bun/bun" },
          "cmake": {},
          "dstask": { aliases: { task: "dstask", t: "dstask" } },
          "fleet": { source: "fleet-cli", completion: "fleet completion zsh" },
          "fnm":
            { completion: "fnm env --use-on-cd --shell zsh", setup: "fnm_lts" },
          "fzf": { completion: "fzf --zsh" },
          "gh": {},
          "glab":
            {
              env:
                {
                  GITLAB_HOST:
                    { value: "@linux.work.gitlabHost", feature: "work" },
                },
            },
          "go": { path: ["$HOME/go/bin"] },
          "hcloud": {},
          "helm": { needs: ["kubectl"], completion: "helm completion zsh" },
          "http": { source: "httpie" },
          "jq": {},
          "k3d": { needs: ["kubectl"], completion: "k3d completion zsh" },
          "k9s":
            {
              source: "derailed/k9s/k9s",
              env: { K9S_FEATURE_GATE_NODE_SHELL: "true" },
            },
          "kompose": { completion: "kompose completion zsh" },
          "krr": { source: "robusta-dev/homebrew-krr/krr" },
          "kubectl": { aliases: { k: "kubectl" }, setup: "kubectl_krew" },
          "kustomize": {},
          "lazygit": { source: "jesseduffield/lazygit/lazygit" },
          "mutagen": { source: "mutagen-io/mutagen/mutagen" },
          "op": { source: "1password-cli" },
          "rtk": {},
          "thefuck": { completion: "thefuck --alias" },
          "vkv":
            {
              source: "falcosuessgott/tap/vkv",
              completion: "vkv completion zsh",
            },
          "yq": {},
        },
      cargo:
        {
          "bat": {},
          "broot": { completion: "broot --print-shell-function zsh" },
          "cargo-install-update":
            {
              source: "cargo-update",
              needs: ["libssl-dev", "pkg-config"],
              aliases: { ciu: "cargo install-update -a" },
            },
          "dust": { source: "du-dust", aliases: { du: "dust" } },
          "exa": { aliases: { ls: "exa" } },
          "fd": { source: "fd-find" },
          "git-prism": { setup: "git_prism_mcp" },
          "hyperfine": { aliases: { bench: "hyperfine" } },
          "procs": {},
          "rg": { source: "ripgrep" },
          "sccache":
            {
              needs: ["libssl-dev", "pkg-config"],
              env: { RUSTC_WRAPPER: "sccache" },
              aliases:
                {
                  ci: "RUSTC_WRAPPER=sccache cargo install --locked",
                  cb: "RUSTC_WRAPPER=sccache cargo build",
                  cbr: "RUSTC_WRAPPER=sccache cargo build --release",
                },
            },
          "zoxide": { completion: "zoxide init zsh" },
        },
      custom:
        {
          "ail-cli":
            {
              gate: "!wsl",
              source: "custom",
              install: 'ARCH="$( { uname -m 2>/dev/null || arch; } | sed -e ''s/x86_64/amd64/'' -e ''s/aarch64/arm64/'')" && curl -sSLf "$(get-latest-release.sh TheAssassin/AppImageLauncher "*${ARCH}.deb")" -o /tmp/appimagelauncher.deb && sudo apt install /tmp/appimagelauncher.deb && rm /tmp/appimagelauncher.deb',
            },
          "az":
            {
              source: "custom",
              install: "curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash",
            },
          "cache-fix-proxy":
            {
              gate: "!wsl",
              source: "custom",
              install: "npm install -g claude-code-cache-fix",
              env: { ANTHROPIC_BASE_URL: "http://127.0.0.1:9801" },
              setup: "cache_fix_proxy_service",
            },
          "dotnet-install.sh":
            {
              source: "custom",
              install: 'mkdir -p "$HOME/.local/bin" && curl -L https://dot.net/v1/dotnet-install.sh -o "$HOME/.local/bin/dotnet-install.sh" && chmod +x "$HOME/.local/bin/dotnet-install.sh"',
            },
          "helmfmt":
            {
              source: "custom",
              install: "go install github.com/digitalstudium/helmfmt@latest",
            },
          "nvim":
            {
              source: "custom",
              install: "updateNeovim",
              aliases: { nano: "nvim" },
            },
          "uv":
            {
              source: "custom",
              install: "curl -LsSf https://astral.sh/uv/install.sh | sh",
              completion: "uv generate-shell-completion zsh",
            },
          "uvx": { completion: "uvx --generate-shell-completion zsh" },
        },
    },
}
